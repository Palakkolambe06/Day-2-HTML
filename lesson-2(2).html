<!DOCTYPE html>
<html>
<head>
    <title>Amazon Product</title>
    <style>
        .amazon-link {
            color: rgb(0, 113, 133);
        }
        .product-name {
            font-size: 24px;
            font-weight: bold;
        }
        .price {
            color: rgb(0, 118, 0);
            font-weight: bold;
        }
        .delivery {
            color: black;
        }
        .cart-button {
            background-color: rgb(255, 216, 20);
            color: black;
            border: none;
            height: 30px;
            width: 110px;
            border-radius: 15px;
            cursor: pointer;
            margin-right: 8px;
        }
        .buy-button {
            background-color: rgb(255, 164, 28);
            color: black;
            border: none;
            height: 30px;
            width: 110px;
            border-radius: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <a href="https://www.amazon.com" class="amazon-link">Back to Amazon</a>
    <p class="product-name">Nike Black Running Shoes</p>
    <p class="price">$39 - in stock.</p>
    <p class="delivery">Free delivery tomorrow.</p>
    <button class="cart-button">Add to Cart</button>
    <button class="buy-button">Buy now</button>

</body>
</html>
