<!DOCTYPE html>
<html>
<head>
    <title>Buttons</title>

    <style>
        .subscriber-button {
            background-color: #ff0000;
            color: white; /*Text color */
            border: none;
            height: none;
            width: 105px;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 200px;
            padding: 200px;
        }

        .join-button {
            background-color: rgb(79, 184, 100);
            border-color: #0000ff;
            border-style: solid;
            border-width: 1px;
            color: #0000ff;
            height: 30px;
            width: 105px;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 5px;
        }

        .tweet-button {
            background-color: #1da1f2;
            border-color: #1da1f2;
            border: none;
            height: 30px;
            width: 74px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            margin-right: 5px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <button class="subscriber-button">SUBSCRIBE</button>

    <button class="join-button">JOIN</button>

    <button class="tweet-button">TWEET</button>

</body>
</html>
