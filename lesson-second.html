/* Use css to recreate these buttons from famous websites.
     1. uber
     2. amazon
     3. Github
     4. Bootstrap
     5. linkedin
     */
<!DOCTYPE html>
<html>
<head>
    <title>Recreating buttons</title>

    <style>
        /* 2a - Uber */
        .request-button {
            background-color: black;
            color: white;
            border: none;
            height: 40px;
            width: 120px;
            cursor: pointer;
            margin-right: 10px;
        }

        /* 2b - Amazon */
        .cart-button {
            background-color: rgb(255, 216, 20);
            color: black;
            border: none;
            height: 40px;
            width: 180px;
            border-radius: 20px;
            cursor: pointer;
            margin-right: 10px;
        }

        /* 2c - GitHub */
        .signup-button {
            background-color: rgb(46, 164, 79);
            color: white;
            border: none;
            height: 40px;
            width: 100px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
        }

        /* 2d - Bootstrap */
        .get-started-button {
            background-color: rgb(121, 82, 179);
            color: white;
            border: none;
            height: 40px;
            width: 120px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 5px;
        }

        .download-button {
            background-color: white;
            color: rgb(108, 117, 125);
            border: 1px solid rgb(108, 117, 125);
            height: 40px;
            width: 120px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
        }

        /* 2e - LinkedIn */
        .apply-button {
            background-color: rgb(10, 102, 194);
            color: white;
            border: none;
            height: 40px;
            width: 250px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
        }

        .save-button {
            background-color: white;
            color: rgb(10, 102, 194);
            border: 1px solid rgb(10, 102, 194);
            height: 40px;
            width: 80px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Lesson 2 - CSS Basics</h2>

    <h3>2a. Uber</h3>
    <button class="request-button">Request now</button>

    <h3>2b. Amazon</h3>
    <button class="cart-button">Add to Cart</button>

    <h3>2c. GitHub</h3>
    <button class="signup-button">Sign up</button>

    <h3>2d. Bootstrap</h3>
    <button class="get-started-button">Get started</button>
    <button class="download-button">Download</button>

    <h3>2e. LinkedIn</h3>
    <button class="apply-button">Apply on company website</button>
    <button class="save-button">Save</button>

</body>
</html>
