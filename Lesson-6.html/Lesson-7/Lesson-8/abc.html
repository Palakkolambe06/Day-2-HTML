<!DOCTYPE html>
<html>
<head>
    <title>Lesson 8 Exercises</title>

    <style>
        /* 8a */
        .name,
        .email {
            display: block;
            margin-bottom: 5px;
            padding: 8px;
        }


        /* 8b */
        .message {
            width: 300px;
            display: inline-block;
            vertical-align: middle;
        }

        .yes,
        .no {
            display: inline-block;
            vertical-align: middle;
            padding: 8px 15px;
        }


        /* 8c */
        .google {
            text-align: center;
            margin-top: 30px;
        }

        .google img {
            width: 250px;
            margin-bottom: 20px;
        }

        .search {
            width: 500px;
            padding: 15px;
            border: none;
            border-radius: 25px;
            box-shadow: 0 1px 6px gray;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h2>8a. Text Boxes</h2>

    <input class="name" type="text" placeholder="Name">

    <input class="email" type="text" placeholder="Email">


    <h2>8b. Customer Support</h2>

    <p class="message">
        Thanks for chatting with our customer support.
        Would you like to take our quick survey?
    </p>

    <button class="yes">Yes</button>
    <button class="no">No</button>


    <h2>8c. Google Search</h2>

    <div class="google">

        <img src="google-logo.png">

        <br>

        <input class="search"
            type="text"
            placeholder="Search Google or type a URL">

    </div>

</body>
</html>
