<!DOCTYPE html>
<html>
<head>
    <title>Lesson 8 Challenge</title>

    <style>
        body {
            font-family: Arial;
        }

        /* 8d */
        .signup {
            width: 400px;
        }

        .signup input {
            padding: 15px;
            font-size: 18px;
            border: 1px solid gray;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .first-name {
            width: 49%;
        }

        .email {
            width: 100%;
            margin-top: 12px;
        }

        .signup button {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            background-color: #3875e8;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }


        /* 8e */
        .uber {
            width: 450px;
        }

        .uber h1 {
            font-size: 40px;
            font-weight: normal;
        }

        .uber input {
            width: 100%;
            padding: 15px;
            margin-bottom: 8px;
            background-color: #eeeeee;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        .request {
            background-color: black;
            color: white;
            border: none;
            padding: 15px 25px;
            margin-top: 30px;
            font-size: 16px;
        }

        .schedule {
            background-color: #eeeeee;
            border: none;
            padding: 15px 25px;
            margin-left: 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h2>8d. Sign Up Form</h2>

    <div class="signup">

        <input class="first-name" type="text" placeholder="First name">

        <input class="first-name" type="text" placeholder="First name">

        <input class="email" type="text" placeholder="Email">

        <button>Sign Up</button>

    </div>


    <h2>8e. Uber Request-a-Ride Form</h2>

    <div class="uber">

        <h1>Request a ride now</h1>

        <input type="text" placeholder="Enter pickup location">

        <input type="text" placeholder="Enter destination">

        <button class="request">Request now</button>

        <button class="schedule">Schedule for later</button>

    </div>

</body>
</html>
