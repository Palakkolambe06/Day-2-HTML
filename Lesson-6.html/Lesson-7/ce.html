<!DOCTYPE html>
<html>
<head>
    <title>Lesson 7 Exercises</title>

    <style>
        body {
            font-family: Arial;
        }

        /* 7d */
        .search1 {
            width: 250px;
            padding: 15px;
            border: 1px solid gray;
            border-radius: 10px;
            font-size: 18px;
        }

        /* 7e */
        .search2 {
            width: 400px;
            padding: 15px;
            border: none;
            border-radius: 25px;
            box-shadow: 0 1px 6px gray;
            font-size: 16px;
        }

        /* 7f */
        .email {
            width: 400px;
            padding: 10px;
        }

        .privacy {
            color: gray;
        }

        .join {
            width: 425px;
            padding: 15px;
            background-color: #2867c7;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
        }

        /* 7g */
        .profile {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            vertical-align: middle;
        }

        .tweet-text {
            width: 300px;
            padding: 12px;
            border: none;
            font-size: 18px;
            vertical-align: middle;
        }

        .tweet {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <h2>7d. Rounded corners</h2>

    <input class="search1" type="text" placeholder="Search">


    <h2>7e. Shadow and no border</h2>

    <input class="search2" type="text"
        placeholder="Search Google or type a URL">


    <h2>7f. LinkedIn signup</h2>

    <p>Email</p>

    <input class="email" type="text">

    <p class="privacy">
        By clicking Agree & Join, you agree to the Privacy Policy.
    </p>

    <button class="join">Agree & Join</button>


    <h2>7g. Twitter text box</h2>

    <img class="profile" src="cat.jpg">

    <input class="tweet-text" type="text"
        placeholder="What's happening?">

    <button class="tweet">Tweet</button>

</body>
</html>
