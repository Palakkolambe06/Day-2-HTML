<!DOCTYPE html>
<html>
<head>
    <title>Lesson 4 - CSS Buttons</title>

    <style>

        /* Uber */
        .uber-button {
            background-color: black;
            color: white;
            border: none;
            padding: 12px 25px;
        }


        /* Amazon */
        .amazon-button {
            background-color: #ffd814;
            color: black;
            border: none;
            padding: 12px 40px;
            border-radius: 20px;
        }


        /* GitHub */
        .github-button {
            background-color: #2da44e;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            box-shadow: 0 4px 8px gray;
        }


        /* Bootstrap */
        .bootstrap-button {
            background-color: #6f42c1;
            color: white;
            border: none;
            padding: 12px 25px;
        }

        .download-button {
            background-color: white;
            color: gray;
            border: 1px solid gray;
            padding: 12px 25px;
            margin-left: 10px;
        }


        /* LinkedIn */
        .linkedin-button {
            background-color: #0a66c2;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
        }

        .save-button {
            background-color: white;
            color: #0a66c2;
            border: 2px solid #0a66c2;
            padding: 10px 25px;
            border-radius: 25px;
            margin-left: 10px;
        }


        /* Tweet */
        .tweet-button {
            background-color: #1d9bf0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
        }


        /* Subscribe */
        .subscribe-button {
            background-color: red;
            color: white;
            border: none;
            padding: 12px 25px;
        }


        /* Join */
        .join-button {
            background-color: white;
            color: #1a5dab;
            border: 1px solid #1a5dab;
            padding: 10px 25px;
            margin-left: 10px;
        }

    </style>
</head>

<body>

    <h2>Uber</h2>
    <button class="uber-button">Request now</button>

    <h2>Amazon</h2>
    <button class="amazon-button">Add to Cart</button>

    <h2>GitHub</h2>
    <button class="github-button">Sign up</button>

    <h2>Bootstrap</h2>
    <button class="bootstrap-button">Get started</button>
    <button class="download-button">Download</button>

    <h2>LinkedIn</h2>
    <button class="linkedin-button">Apply on company website</button>
    <button class="save-button">Save</button>

    <h2>YouTube</h2>
    <button class="subscribe-button">SUBSCRIBE</button>

    <button class="join-button">JOIN</button>

    <button class="tweet-button">Tweet</button>

</body>
</html>
