<!DOCTYPE html>
<html>
<head>
    <title>Lesson 4 Challenge Exercises</title>

    <style>
        /* 4h - Pagination */
        .pagination {
            margin-bottom: 40px;
        }

        .pagination button {
            padding: 15px 20px;
            font-size: 20px;
            margin-right: 10px;
            cursor: pointer;
        }

        .pagination a {
            margin: 0 8px;
            font-size: 22px;
            color: purple;
        }

        /* 4i - Stretch */

        .stretch-button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 20px;

            transition: padding 0.5s;
        }

        .stretch-button:hover {
            padding: 20px 40px;
        }

        /* 4j - 3D Click */

        .shadow-button {
            background-color: green;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;

            box-shadow: 5px 5px 5px gray;
            cursor: pointer;
        }

        .shadow-button:active {
            box-shadow: none;
            margin-top: 5px;
            margin-left: 5px;
        }

        /* 4k - Margin and Padding */

        .green-button {
            background-color: green;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;

            margin-right: 20px;
        }

    </style>
</head>
<body>

    <!-- 4h - Pagination -->
    <h2>4h. Pagination</h2>
    <div class="pagination">

        <button>Back</button>
        <a href="#">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">4</a>
        <a href="#">5</a>
        <button>Next</button>

    </div>

    <!-- 4i - Stretch -->

    <h2>4i. Stretch</h2>
    <button class="stretch-button">
        Stretch
    </button>


    <!-- 4j - 3D Click -->

    <h2>4j. 3D Click</h2>
    <button class="shadow-button">
        Shadow
    </button>

    <!-- 4k - Margin and Padding Together -->

    <h2>4k. Margin and Padding Together</h2>
    <button class="green-button">
        One
    </button>
    <button class="green-button">
        Two
    </button>
    <button class="green-button">
        Three
    </button>

</body>
</html>
