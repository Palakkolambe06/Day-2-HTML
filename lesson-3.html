<!DOCTYPE html>
<html>
<head>
    <title>CSS Buttons</title>
    <style>

        /* Uber */
        .uber-button {
            background-color: black;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
        }

        .uber-button:hover {
            opacity: 0.7;
        }

        /* Amazon */
        .amazon-button {
            background-color: #ffd814;
            color: black;
            border: none;
            padding: 12px 40px;
            border-radius: 25px;
            cursor: pointer;
        }

        .amazon-button:hover {
            background-color: #f7ca00;
        }

        /* GitHub */
        .github-button {
            background-color: #2da44e;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .github-button:hover {
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        /* Bootstrap */
        .bootstrap-button {
            background-color: #6f42c1;
            color: white;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            cursor: pointer;
        }

        .bootstrap-button:hover {
            background-color: #59339d;
        }

        .download-button {
            background-color: white;
            color: #666;
            border: 1px solid #777;
            padding: 12px 25px;
            margin-left: 10px;
            cursor: pointer;
        }

        .download-button:hover {
            background-color: #eee;
        }

        /* LinkedIn */
        .linkedin-button {
            background-color: #0a66c2;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }

        .linkedin-button:hover {
            background-color: #004182;
        }

        .save-button {
            background-color: white;
            color: #0a66c2;
            border: 2px solid #0a66c2;
            padding: 10px 25px;
            border-radius: 25px;
            margin-left: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-button:hover {
            background-color: #e8f3ff;
        }

    </style>
</head>
<body>

    <h2>3a. Uber</h2>
    <button class="uber-button">Request now</button>
    <h2>3b. Amazon</h2>
    <button class="amazon-button">Add to Cart</button>
    <h2>3c. GitHub</h2>
    <button class="github-button">Sign up</button>
    <h2>3d. Bootstrap</h2>
    <button class="bootstrap-button">Get started</button>
    <button class="download-button">Download</button>
    <h2>3e. LinkedIn</h2>
    <button class="linkedin-button">Apply on company website</button>
    <button class="save-button">Save</button>
</body>
</html>
