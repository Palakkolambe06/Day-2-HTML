<!DOCTYPE html>
<html>
<head>
  <title>Lesson 17a - Media Queries</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: white;
    }

    .videos {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
    }

    .video {
      min-width: 0;
    }

    .thumbnail {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .video-title {
      font-size: 14px;
      line-height: 20px;
      font-weight: bold;
      margin-top: 8px;
    }

    .video-info {
      font-size: 12px;
      color: gray;
      line-height: 18px;
    }

    /* When the screen is wider than 1000px */
    @media (min-width: 1000px) {
      .video-title {
        font-size: 16px;
        line-height: 24px;
      }

      .video-info {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="videos">

    <div class="video">
      <img
        class="thumbnail"
        src="https://picsum.photos/500/300?random=1"
        alt="Video thumbnail"
      >

      <div class="video-title">
        Talking Tech and AI with Google CEO Sundar Pichai
      </div>

      <div class="video-info">
        Marques Brownlee<br>
        3.4M views · 6 months ago
      </div>
    </div>


    <div class="video">
      <img
        class="thumbnail"
        src="https://picsum.photos/500/300?random=2"
        alt="Video thumbnail"
      >

      <div class="video-title">
        Try Not To Laugh Challenge #9
      </div>

      <div class="video-info">
        Markiplier<br>
        19M views · 4 years ago
      </div>
    </div>


    <div class="video">
      <img
        class="thumbnail"
        src="https://picsum.photos/500/300?random=3"
        alt="Video thumbnail"
      >

      <div class="video-title">
        Crazy Tik Toks Taken Moments Before DISASTER
      </div>

      <div class="video-info">
        SSSniperWolf<br>
        12M views · 1 year ago
      </div>
    </div>

  </div>

</body>
</html>
