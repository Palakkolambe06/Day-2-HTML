<!DOCTYPE html>
<html>
<head>
  <title>9g</title>

  <style>
    .card {
      width: 180px;
      display: inline-block;
      vertical-align: top;
      margin-right: 10px;
      box-shadow: 0 1px 5px gray;
    }

    .card img {
      width: 180px;
      height: 180px;
      object-fit: cover;
    }

    .card p {
      margin: 8px;
    }

    button {
      margin: 8px;
      padding: 8px 15px;
      background-color: #3578e5;
      color: white;
      border: none;
      border-radius: 3px;
    }
  </style>
</head>

<body>

  <div class="card">
    <img src="cat.jpg">
    <p><b>Oliver</b></p>
    <p>2 mutual friends</p>
    <button>Add Friend</button>
  </div>

  <div class="card">
    <img src="cat.jpg">
    <p><b>Mimi</b></p>
    <p>3 mutual friends</p>
    <button>Add Friend</button>
  </div>

  <div class="card">
    <img src="cat.jpg">
    <p><b>Rex</b></p>
    <p>4 mutual friends</p>
    <button>Add Friend</button>
  </div>

</body>
</html>
