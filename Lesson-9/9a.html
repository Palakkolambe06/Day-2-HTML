<!DOCTYPE html>
<html>
<head>
  <title>Lesson 9 Exercises</title>

  <style>
    /* 9a */
    .red-box {
      width: 85px;
      height: 85px;
      background-color: red;
    }

    /* 9b */
    .green-circle {
      width: 85px;
      height: 85px;
      background-color: green;
      border-radius: 50%;
    }

    /* 9c */
    .service-box {
      width: 350px;
      padding: 20px;
      border: 1px solid gray;
    }

    /* 9d */
    .music-box {
      width: 400px;
      padding: 20px;
      background-color: #222;
      color: white;
    }

    .music-box p {
      color: gray;
    }
  </style>
</head>

<body>

  <!-- 9a -->
  <h2>9a</h2>
  <div class="red-box"></div>

  <!-- 9b -->
  <h2>9b</h2>
  <div class="green-circle"></div>

  <!-- 9c -->
  <h2>9c</h2>
  <div class="service-box">
    <p>Satisfied with our service?</p>
    <button>Yes</button>
    <button>No</button>
  </div>

  <!-- 9d -->
  <h2>9d</h2>
  <div class="music-box">
    <p>Install YouTube Music</p>
    <p>Add YouTube Music to your desktop for quick and easy access</p>
  </div>

</body>
</html>
