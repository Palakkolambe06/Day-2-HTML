<!DOCTYPE html>
<html>
<head>
  <title>Google Search</title>

  <style>
    div {
      text-align: center;
    }

    img {
      width: 300px;
    }

    input {
      width: 500px;
      padding: 12px;
      border-radius: 25px;
      border: 1px solid gray;
    }

    button {
      padding: 10px 20px;
      margin: 20px 5px;
    }
  </style>
</head>

<body>

  <div>
    <img src="google.png">
  </div>

  <div>
    <input type="text" placeholder="Search Google or type a URL">
  </div>

  <div>
    <button>Google Search</button>
    <button>I'm Feeling Lucky</button>
  </div>

</body>
</html>
